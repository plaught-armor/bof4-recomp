; Breath of Fire IV native port settings. Read from the working directory,
; or from the file named by BOF4_CONFIG. Every value shown is the default.

[window]
; Desktop fullscreen. Alt+Enter or F11 toggles it while playing.
fullscreen = false
; fit = largest 4:3 picture the window holds; integer = whole multiples of
; 640x480 only, so every pixel is the same size.
scale = fit
; nearest = sharp pixels as on a console; linear = smoothed.
filter = nearest
detail = 2
; Pause while another window has focus. Pause or P (unless bound under [keys])
; and the controller's guide button pause and resume at any time.
pause_unfocused = true
; Draw an extra in-between picture for each repeated frame, so walking,
; camera turns, battle sprites and menus move at the display rate (the game
; updates at 30).
smooth_motion = true

[audio]
; Milliseconds from a sound being mixed to it reaching the speakers (20 to
; 250), not counting the OS mixer. Lower answers the pad sooner, which helps
; rhythm minigames; raise it if sound crackles.
latency_ms = 50

[disc]
; Skip the wait for disc loads: the game runs at full speed while the drive
; reads behind a still picture, so loads take next to no time. Movies,
; streamed audio and anything animated during a load (the swirl into a battle)
; keep their normal pace.
instant_loading = true
; Skip the wait while the screen is all black: the game runs at full speed
; until something shows (e.g. the dark pause after naming Ryu). Movies keep
; their normal pace.
skip_black = true

[field]
; Random battle frequency: 0 = none, 0.5 = half, 1 = original, 2 = double (max 16).
encounter_rate = 1.0
minimap = false

[text]
; Show each page of a message at once instead of letter by letter.
instant = false
; Holding the confirm button reveals each page and turns it automatically.
hold_to_advance = true

[battle]
; Battle speed: 1 = original, 2 = twice as fast (max 8). Game timing is kept;
; only real time passes faster during battles.
speed = 1.0
; Skip the pauses between one action and the next (messages, effects and
; actions still play in full).
quick_turns = true
; Skip the dead time inside a round, when every combatant is back at rest and
; only a damage number is settling (its first bounce always plays in full).
quick_idle = true
; Damage and healing numbers over combatants. Messages such as misses still show.
damage_numbers = true

[minigame]
; Slow motion for fishing, the Sandflier hunt and Kecak: 1 = original,
; 0.5 = half speed (min 0.25). Sound plays slower and lower, still on the beat.
speed = 1.0

[camera]
; Speed of the L1/R1 (Q/E) camera turn: 1 = original (0.8 s a turn), 2 = twice
; as fast (max 8).
rotate_speed = 3.0
; Keep turning in 90 degree steps while L1/R1 stays held.
hold_to_spin = true
; Right stick turns the camera freely on maps that allow any angle.
stick = true
; Degrees per second at full tilt (1 to 720).
stick_speed = 120
; Drag with the right mouse button to turn the camera: freely on maps that
; allow any angle, and one L1/R1 turn per short drag on the others.
mouse = true
; Degrees per pixel of mouse drag (0.01 to 4).
mouse_speed = 0.3
; Also allow the stick and free mouse turning on maps the game limits to
; fixed angles. Those maps may show unfinished scenery from other sides.
stick_all_maps = false
; Camera shake from attacks and events. false holds the view steady.
screen_shake = true
third_person = true

[move]
free = true
; The left stick walks toward its exact angle, relative to the camera, on
; the game's eight-direction grid.
stick = true
; Stick tilt (0 to 1) that runs as if the dash button were held; a lighter
; tilt walks.
run_tilt = 0.7
; Start walking on the first frame a direction is held. The game waits two
; frames first, so a quick tap only turns the leader in place.
instant_start = true

[save]
; The camp menu's Save command works on every map, not only the world map.
; Loading resumes at the spot where the party stood.
anywhere = true
; Save on entering each field map, once the player has control. Autosaves go
; to the memory card in slot 2 (bof4_slot2.mcd), so card 1 saves are never
; overwritten; load them by choosing slot 2 on the load screen.
autosave = true
; Save number on the slot 2 card that autosave uses (1-15).
autosave_slot = 15

[masters]
; F2 shows or hides a panel of every master: a list on the left and, for the
; one chosen, its pupil, what it counts, every reward and what it needs (green
; when ready) and the stat bonus it adds at every level-up. The camp menu's
; Masters command shows it too. Up/Down choose a master; Cross, Circle or
; Triangle hide it. A ready reward is collected when an apprentice visits the
; master.
tracker = true
; A notice when an apprentice's master has a new skill (or item) ready.
alerts = true

[keys]
; Keyboard keys for each console button, comma-separated SDL key names.
; Mouse buttons work too: Mouse Left, Mouse Middle, Mouse Right, Mouse X1,
; Mouse X2, and Wheel Up / Wheel Down (each notch taps the button). The right
; button also drags the camera (see [camera] mouse).
; A line replaces that button's defaults; when swapping two buttons, set both.

[pad]
; Controller buttons for each console button, SDL names in an Xbox layout:
; a, b, x, y, back, start, leftshoulder, rightshoulder, lefttrigger,
; righttrigger, leftstick, rightstick, dpup, dpdown, dpleft, dpright.
; For Nintendo-style confirm, swap: cross = b and circle = a.
cross = a
circle = b
square = x
triangle = y
l1 = leftshoulder
r1 = rightshoulder
l2 = lefttrigger
r2 = righttrigger
start = start
select = back
up = dpup
down = dpdown
left = dpleft
right = dpright
